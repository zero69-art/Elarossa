name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Catalog · HAR · Build · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate product media
        run: npm run validate:media

      - name: Validate catalog / CJ PIDs
        run: npm run validate:cj

      - name: Sanitize HAR fixtures
        run: npm run har:ci:sanitize

      - name: Fail if HAR needed sanitization
        run: |
          if ! git diff --quiet -- e2e/fixtures; then
            echo "::error::HAR fixture(s) contained secrets or unclean fields."
            echo "Run locally: npm run har:sanitize -- e2e/fixtures && npm run har:scan -- e2e/fixtures"
            git diff -- e2e/fixtures
            exit 1
          fi
          echo "HAR fixtures already clean (or none present)."

      - name: Scan HAR fixtures for secrets
        run: npm run har:scan -- e2e/fixtures

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (production server)
        run: npx playwright test --project=chromium
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Visual regression screenshots
        id: visual
        continue-on-error: true
        run: npx playwright test --project=visual
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload visual diff screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-screenshots
          path: |
            test-results/
            e2e/visual.spec.ts-snapshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  post-deploy:
    name: Post-deploy smoke (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel deployment
        run: sleep 45

      - name: E2E smoke against production
        run: npx playwright test --project=chromium
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: https://elarossa.vercel.app

      - name: Visual regression against production
        continue-on-error: true
        run: npx playwright test --project=visual
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: https://elarossa.vercel.app

      - name: Upload production visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-screenshots-production
          path: |
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload production smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: |
            playwright-report/
            test-results/
          retention-days: 7
